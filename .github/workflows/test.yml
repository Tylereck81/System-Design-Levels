name: Tests
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # the project's Node version; package.json's engines asks the same locally
          cache: npm
      - id: deps
        run: npm ci
      - id: browsers
        run: npx playwright install --with-deps chromium
      # Each check runs whenever what it needs installed, so one failing check never hides another's results,
      # and nothing runs after a failed install (its errors would bury the real one).
      - run: npm run lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      - run: npm run test:unit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      # A test that only passed on its retry is flaky: it fails the job instead of hiding behind the retry.
      - run: npm run test:e2e -- --fail-on-flaky-tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
