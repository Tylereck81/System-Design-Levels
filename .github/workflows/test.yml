name: Tests
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # the project's Node version; package.json's engines asks the same locally
          cache: npm
      - id: deps
        run: npm ci
      - id: browsers
        run: npx playwright install --with-deps chromium
      # Each check runs whenever what it needs installed, so one failing check never hides another's results,
      # and nothing runs after a failed install (its errors would bury the real one).
      - run: npm run lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
      # The test steps record code coverage as they run (tests/coverage/); the coverage step below reports on it.
      - id: unit
        run: npm run test:unit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/node-v8
      - id: integration
        run: npm run test:integration
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/node-v8
      # A test that only passed on its retry is flaky: it fails the job instead of hiding behind the retry.
      - id: e2e
        run: npm run test:e2e -- --fail-on-flaky-tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          COVERAGE: '1'
      # Fails if a folder's coverage falls below its minimum. Only after every test step passed: a failed test
      # leaves its lines unrun, and the coverage failure would bury the real one.
      - id: coverage
        run: npm run coverage:report
        if: ${{ !cancelled() && steps.unit.outcome == 'success' && steps.integration.outcome == 'success' && steps.e2e.outcome == 'success' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        with:
          name: coverage-report
          path: |
            coverage/report/
            !coverage/report/.cache/
          retention-days: 7
      # The browser tests' traces and screenshots, when they are what failed.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
