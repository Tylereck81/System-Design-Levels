name: Tests
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # the project's Node version; package.json's engines asks the same locally
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Two steps, so a failing Node test does not hide the browser tests' results. The browser tests still do not
      # run after a failed install: their errors would bury the real one.
      - id: unit
        run: npm run test:unit
      # A test that only passed on its retry is flaky: it fails the job instead of hiding behind the retry.
      - run: npm run test:e2e -- --fail-on-flaky-tests
        if: ${{ success() || steps.unit.outcome == 'failure' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
